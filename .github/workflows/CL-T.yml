name: 源码更新检测测试

permissions: write-all

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 每天中国时间凌晨 02:00

jobs:
  source-check:
    name: 自动检测所有源码
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 检出当前仓库
      # ==========================================================

      - name: 检出仓库
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 1

      # ==========================================================
      # 恢复上一次源码状态
      # ==========================================================

      - name: 恢复源码状态
        uses: actions/cache/restore@v6
        with:
          path: .github/source-state/cache
          key: source-state

      # ==========================================================
      # 自动扫描 Workflow
      # ==========================================================

      - name: 扫描所有 Workflow
        id: scan
        shell: bash
        run: |
          set -e

          mkdir -p .github/source-state/cache

          echo "============================================================"
          echo "自动扫描 .github/workflows"
          echo "============================================================"

          python3 <<'PY'
          import os
          import re
          import json

          workflows_dir = ".github/workflows"

          if not os.path.isdir(workflows_dir):
              print("❌ .github/workflows 不存在")
              raise SystemExit(1)

          workflows = []

          for filename in sorted(os.listdir(workflows_dir)):

              if not (
                  filename.endswith(".yml")
                  or filename.endswith(".yaml")
              ):
                  continue

              if filename == "source-update-check.yml":
                  continue

              path = os.path.join(workflows_dir, filename)

              if not os.path.isfile(path):
                  continue

              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              repo_match = re.search(
                  r'^\s*REPO_URL\s*:\s*["\']?([^"\'\n#]+)["\']?\s*(?:#.*)?$',
                  content,
                  re.MULTILINE
              )

              branch_match = re.search(
                  r'^\s*REPO_BRANCH\s*:\s*["\']?([^"\'\n#]+)["\']?\s*(?:#.*)?$',
                  content,
                  re.MULTILINE
              )

              dispatch_match = re.search(
                  r'^\s*workflow_dispatch\s*:',
                  content,
                  re.MULTILINE
              )

              if not repo_match or not branch_match:
                  print(f"跳过 {filename}")
                  print("  原因：没有 REPO_URL / REPO_BRANCH")
                  continue

              repo_url = repo_match.group(1).strip()
              branch = branch_match.group(1).strip()

              repo_url = re.sub(
                  r'^https?://github\.com/',
                  '',
                  repo_url
              )

              repo_url = re.sub(
                  r'^github\.com/',
                  '',
                  repo_url
              )

              repo_url = repo_url.rstrip("/")

              repo_url = re.sub(
                  r'\.git$',
                  '',
                  repo_url
              )

              source_key = f"{repo_url}@{branch}"

              workflows.append({
                  "file": filename,
                  "repo": repo_url,
                  "branch": branch,
                  "source_key": source_key,
                  "dispatch": bool(dispatch_match)
              })

              print("")
              print(f"发现 Workflow：{filename}")
              print(f"  源码：{repo_url}")
              print(f"  分支：{branch}")
              print(f"  Key：{source_key}")
              print(
                  f"  workflow_dispatch："
                  f"{'是' if dispatch_match else '否'}"
              )

          sources = {}

          for item in workflows:

              key = item["source_key"]

              if key not in sources:
                  sources[key] = {
                      "repo": item["repo"],
                      "branch": item["branch"]
                  }

          with open(
              ".github/source-state/workflows.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  workflows,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              ".github/source-state/sources.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print(f"发现 Workflow：{len(workflows)}")
          print(f"发现独立源码：{len(sources)}")
          print("============================================================")
          PY

      # ==========================================================
      # 自动检测所有源码
      # ==========================================================

      - name: 检测所有源码更新
        id: check
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "开始检测源码"
          echo "============================================================"

          python3 <<'PY'
          import os
          import json
          import subprocess

          SOURCES_FILE = ".github/source-state/sources.json"
          STATE_FILE = ".github/source-state/cache/state.json"

          with open(SOURCES_FILE, "r", encoding="utf-8") as f:
              sources = json.load(f)

          # ========================================================
          # 从 Actions Cache 恢复上一次检测状态
          # ========================================================

          old_state = {}

          if os.path.isfile(STATE_FILE):

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      old_state = json.load(f)

              except Exception:

                  print("⚠️ 上一次 SOURCE_STATE 格式错误")
                  print("将按照首次检测处理")
                  old_state = {}

          print("")
          print("============================================================")
          print("上一次检测状态")
          print("============================================================")

          if old_state:

              for key, commit in old_state.items():

                  print(f"  {key}")
                  print(f"    {commit}")

          else:

              print("  无")

          # ========================================================
          # 新状态
          # 每次检测完成后只保存最新 Commit
          # ========================================================

          new_state = {}
          updated = []

          github_output = os.environ.get("GITHUB_OUTPUT")

          if github_output:

              with open(
                  github_output,
                  "a",
                  encoding="utf-8"
              ) as out:

                  out.write("has_updates=false\n")

          # ========================================================
          # 检测每一个独立源码
          # ========================================================

          for source_key, source in sources.items():

              repo = source["repo"]
              branch = source["branch"]

              print("")
              print("------------------------------------------------------------")
              print(f"源码：{source_key}")
              print(f"仓库：{repo}")
              print(f"分支：{branch}")
              print("------------------------------------------------------------")

              url = f"https://github.com/{repo}.git"

              result = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      url,
                      f"refs/heads/{branch}"
                  ],
                  capture_output=True,
                  text=True
              )

              # ----------------------------------------------------
              # 获取失败
              # ----------------------------------------------------

              if result.returncode != 0:

                  print("❌ git ls-remote 失败")
                  print(result.stderr)

                  if source_key in old_state:
                      new_state[source_key] = old_state[source_key]

                  continue

              new_commit = ""

              for line in result.stdout.splitlines():

                  parts = line.split()

                  if len(parts) >= 1:

                      new_commit = parts[0]
                      break

              if not new_commit:

                  print("❌ 无法获取最新 Commit")

                  if source_key in old_state:
                      new_state[source_key] = old_state[source_key]

                  continue

              # ----------------------------------------------------
              # 上一次 Commit
              # ----------------------------------------------------

              old_commit = old_state.get(
                  source_key,
                  ""
              )

              print(
                  f"旧 Commit："
                  f"{old_commit if old_commit else '无'}"
              )

              print(f"新 Commit：{new_commit}")

              # ----------------------------------------------------
              # 本次成功检测结果成为下一次比较基准
              # ----------------------------------------------------

              new_state[source_key] = new_commit

              # ----------------------------------------------------
              # 首次检测
              # ----------------------------------------------------

              if not old_commit:

                  print("首次检测")

                  updated.append(source_key)

                  print("已记录当前 Commit")
                  print("首次检测触发编译")

                  continue

              # ----------------------------------------------------
              # 源码发生变化
              # ----------------------------------------------------

              if old_commit != new_commit:

                  print("✅ 检测到源码更新")

                  updated.append(source_key)

                  print("已更新状态")

              else:

                  print("源码没有更新")

          # ========================================================
          # 保存新的源码状态
          # ========================================================

          os.makedirs(
              os.path.dirname(STATE_FILE),
              exist_ok=True
          )

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  new_state,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print("SOURCE_STATE 已更新")
          print("============================================================")

          for key, commit in new_state.items():

              print(f"  {key}")
              print(f"    {commit}")

          # ========================================================
          # 本次运行临时更新列表
          # ========================================================

          with open(
              ".github/source-state/updated.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  updated,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print("源码检测完成")
          print(f"发生更新的源码：{len(updated)}")
          print("============================================================")

          for item in updated:

              print(f"  UPDATED: {item}")

          if github_output and updated:

              with open(
                  github_output,
                  "a",
                  encoding="utf-8"
              ) as out:

                  out.write("has_updates=true\n")
          PY

      # ==========================================================
      # 保存新的源码状态到 Actions Cache
      # ==========================================================

      - name: 删除旧的源码状态 Cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh api \
            --method DELETE \
            "/repos/${{ github.repository }}/actions/caches?key=source-state" \
            || true

      - name: 保存源码状态
        uses: actions/cache/save@v6
        with:
          path: .github/source-state/cache
          key: source-state

      # ==========================================================
      # 自动清理对应源码的云编译历史和 Releases
      # ==========================================================

      - name: 自动清理对应源码的云编译历史和 Releases
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@main
        with:
          script: |
            const fs = require("fs");

            const workflowsFile =
              ".github/source-state/workflows.json";

            const updatedFile =
              ".github/source-state/updated.json";

            if (!fs.existsSync(workflowsFile)) {
              console.log("❌ workflows.json 不存在");
              return;
            }

            if (!fs.existsSync(updatedFile)) {
              console.log("❌ updated.json 不存在");
              return;
            }

            const workflows =
              JSON.parse(
                fs.readFileSync(
                  workflowsFile,
                  "utf8"
                )
              );

            const updated =
              JSON.parse(
                fs.readFileSync(
                  updatedFile,
                  "utf8"
                )
              );

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("开始自动清理旧的云编译历史");
            console.log(
              "============================================================"
            );

            // ======================================================
            // 只处理源码发生更新的 source_key
            // ======================================================

            const matched = workflows.filter(
              workflow =>
                workflow.dispatch &&
                updated.includes(
                  workflow.source_key
                )
            );

            if (matched.length === 0) {

              console.log(
                "没有找到需要清理的 Workflow"
              );

              return;
            }

            // ======================================================
            // 每一个发生更新的源码分别处理
            // ======================================================

            for (const workflow of matched) {

              console.log("");
              console.log(
                "------------------------------------------------------------"
              );
              console.log(
                `源码：${workflow.source_key}`
              );
              console.log(
                `Workflow：${workflow.file}`
              );
              console.log(
                "------------------------------------------------------------"
              );

              // ====================================================
              // 获取该 Workflow 的全部历史运行
              // ====================================================

              let runs = [];

              try {

                runs =
                  await github.paginate(
                    github.rest.actions.listWorkflowRuns,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      workflow_id: workflow.file,
                      per_page: 100
                    }
                  );

              } catch (error) {

                console.log(
                  `❌ 获取 Workflow 历史失败：${workflow.file}`
                );

                console.log(
                  error.message
                );

                throw error;
              }

              console.log(
                `发现 Workflow 历史运行：${runs.length}`
              );

              // ====================================================
              // 建立历史运行 Commit 集合
              // source_key
              //     ↓
              // Workflow
              //     ↓
              // workflow run
              //     ↓
              // head_sha
              // ====================================================

              const runShas = new Set();

              for (const run of runs) {

                if (
                  run.status === "completed" &&
                  run.head_sha
                ) {

                  runShas.add(
                    run.head_sha
                  );

                }

              }

              console.log(
                `发现历史 Commit：${runShas.size}`
              );

              // ====================================================
              // 获取全部 Releases
              // ====================================================

              let releases = [];

              try {

                releases =
                  await github.paginate(
                    github.rest.repos.listReleases,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      per_page: 100
                    }
                  );

              } catch (error) {

                console.log(
                  "❌ 获取 Releases 失败"
                );

                console.log(
                  error.message
                );

                throw error;
              }

              console.log(
                `发现 Releases：${releases.length}`
              );

              // ====================================================
              // 根据 Release Tag 对应的 Commit 自动识别
              //
              // 不判断：
              //   Release 名称
              //   Release Body
              //   Asset 名称
              //   Workflow 名称
              //
              // 唯一依据：
              //
              // source_key
              //     ↓
              // Workflow
              //     ↓
              // Workflow Run head_sha
              //     ↓
              // Release tag commit
              // ====================================================

              const matchedReleases = [];

              for (const release of releases) {

                if (!release.tag_name) {
                  continue;
                }

                try {

                  const commit =
                    await github.rest.repos.getCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: release.tag_name
                    });

                  const releaseSha =
                    commit.data.sha;

                  if (
                    runShas.has(
                      releaseSha
                    )
                  ) {

                    matchedReleases.push(
                      release
                    );

                    console.log("");
                    console.log(
                      "✅ 找到对应 Release"
                    );

                    console.log(
                      `   Release：${release.name || release.tag_name}`
                    );

                    console.log(
                      `   Tag：${release.tag_name}`
                    );

                    console.log(
                      `   Commit：${releaseSha}`
                    );

                  }

                } catch (error) {

                  console.log("");
                  console.log(
                    `⚠️ 无法解析 Release Tag：${release.tag_name}`
                  );

                  console.log(
                    error.message
                  );

                }
              }

              // ====================================================
              // 删除对应 Releases
              // ====================================================

              for (
                const release of matchedReleases
              ) {

                console.log("");
                console.log(
                  `🗑️ 删除 Release：${release.name || release.tag_name}`
                );

                try {

                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id
                  });

                  console.log(
                    `✅ Release 删除成功：${release.tag_name}`
                  );

                } catch (error) {

                  console.log(
                    `❌ Release 删除失败：${release.tag_name}`
                  );

                  console.log(
                    error.message
                  );

                  throw error;
                }
              }

              // ====================================================
              // 删除该 Workflow 的历史云编译记录
              //
              // Release 删除完成后再删除 Workflow Runs
              // ====================================================

              for (const run of runs) {

                if (
                  run.status !== "completed"
                ) {
                  continue;
                }

                console.log("");
                console.log(
                  `🗑️ 删除云编译历史`
                );

                console.log(
                  `   Workflow：${workflow.file}`
                );

                console.log(
                  `   Run ID：${run.id}`
                );

                console.log(
                  `   Commit：${run.head_sha}`
                );

                try {

                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });

                  console.log(
                    `✅ 云编译历史删除成功：${run.id}`
                  );

                } catch (error) {

                  console.log(
                    `❌ 云编译历史删除失败：${run.id}`
                  );

                  console.log(
                    error.message
                  );

                  throw error;
                }
              }

              console.log("");
              console.log(
                `✅ 源码 ${workflow.source_key} 清理完成`
              );
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("所有更新源码的旧云编译历史和 Releases 清理完成");
            console.log(
              "============================================================"
            );

      # ==========================================================
      # 自动匹配并触发 Workflow
      # ==========================================================

      - name: 自动匹配并触发编译
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@main
        with:
          script: |
            const fs = require("fs");

            const workflowsFile =
              ".github/source-state/workflows.json";

            const updatedFile =
              ".github/source-state/updated.json";

            if (!fs.existsSync(workflowsFile)) {
              console.log("❌ workflows.json 不存在");
              return;
            }

            if (!fs.existsSync(updatedFile)) {
              console.log("❌ updated.json 不存在");
              return;
            }

            const workflows =
              JSON.parse(
                fs.readFileSync(
                  workflowsFile,
                  "utf8"
                )
              );

            const updated =
              JSON.parse(
                fs.readFileSync(
                  updatedFile,
                  "utf8"
                )
              );

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("源码更新列表");
            console.log(
              "============================================================"
            );

            for (const source of updated) {
              console.log(`UPDATED: ${source}`);
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("开始自动匹配 Workflow");
            console.log(
              "============================================================"
            );

            const matched = [];

            for (const workflow of workflows) {

              if (!workflow.dispatch) {

                console.log(
                  `跳过：${workflow.file}`
                );

                console.log(
                  "  原因：没有 workflow_dispatch"
                );

                continue;
              }

              if (
                !updated.includes(
                  workflow.source_key
                )
              ) {
                continue;
              }

              matched.push(workflow);

              console.log(
                `✅ 匹配：${workflow.file}`
              );

              console.log(
                `   源码：${workflow.source_key}`
              );
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log(
              `最终匹配 Workflow：${matched.length}`
            );
            console.log(
              "============================================================"
            );

            if (matched.length === 0) {

              console.log(
                "没有需要触发的 Workflow"
              );

              return;
            }

            // ======================================================
            // 自动触发
            // ======================================================

            for (const workflow of matched) {

              console.log("");
              console.log(
                `🚀 正在触发：${workflow.file}`
              );

              try {

                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.file,
                  ref: "main"
                });

                console.log(
                  `✅ 触发成功：${workflow.file}`
                );

              } catch (error) {

                console.log(
                  `❌ 触发失败：${workflow.file}`
                );

                console.log(
                  error.message
                );

                throw error;
              }
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("所有匹配 Workflow 已处理");
            console.log(
              "============================================================"
            );
