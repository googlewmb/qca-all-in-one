name: 源码更新检测

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "58 6,18 * * *" # 每12小时检测一次，北京时间 02:58、14:58

jobs:
  source-check:
    name: 自动检测所有源码
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 检出当前仓库
      # ==========================================================

      - name: 检出仓库
        uses: actions/checkout@main
        with:
          ref: main
          fetch-depth: 1

      # ==========================================================
      # 自动扫描 Workflow
      # ==========================================================

      - name: 扫描所有 Workflow
        id: scan
        shell: bash
        run: |
          set -e

          mkdir -p .github/source-state

          echo "============================================================"
          echo "自动扫描 .github/workflows"
          echo "============================================================"

          python3 <<'PY'
          import os
          import re
          import json

          workflows_dir = ".github/workflows"

          if not os.path.isdir(workflows_dir):
              print("❌ .github/workflows 不存在")
              raise SystemExit(1)

          workflows = []

          for filename in sorted(os.listdir(workflows_dir)):

              if not (
                  filename.endswith(".yml")
                  or filename.endswith(".yaml")
              ):
                  continue

              # 排除自己
              if filename == "source-update-check.yml":
                  continue

              path = os.path.join(workflows_dir, filename)

              if not os.path.isfile(path):
                  continue

              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # ----------------------------------------------------
              # REPO_URL
              # ----------------------------------------------------

              repo_match = re.search(
                  r'^\s*REPO_URL\s*:\s*["\']?([^"\'\n#]+)["\']?\s*(?:#.*)?$',
                  content,
                  re.MULTILINE
              )

              # ----------------------------------------------------
              # REPO_BRANCH
              # ----------------------------------------------------

              branch_match = re.search(
                  r'^\s*REPO_BRANCH\s*:\s*["\']?([^"\'\n#]+)["\']?\s*(?:#.*)?$',
                  content,
                  re.MULTILINE
              )

              # ----------------------------------------------------
              # workflow_dispatch
              # ----------------------------------------------------

              dispatch_match = re.search(
                  r'^\s*workflow_dispatch\s*:',
                  content,
                  re.MULTILINE
              )

              if not repo_match or not branch_match:
                  print(f"跳过 {filename}")
                  print("  原因：没有 REPO_URL / REPO_BRANCH")
                  continue

              repo_url = repo_match.group(1).strip()
              branch = branch_match.group(1).strip()

              # ----------------------------------------------------
              # 标准化 GitHub 仓库地址
              # ----------------------------------------------------

              repo_url = re.sub(
                  r'^https?://github\.com/',
                  '',
                  repo_url
              )

              repo_url = re.sub(
                  r'^github\.com/',
                  '',
                  repo_url
              )

              repo_url = repo_url.rstrip("/")

              repo_url = re.sub(
                  r'\.git$',
                  '',
                  repo_url
              )

              source_key = f"{repo_url}@{branch}"

              workflows.append({
                  "file": filename,
                  "repo": repo_url,
                  "branch": branch,
                  "source_key": source_key,
                  "dispatch": bool(dispatch_match)
              })

              print("")
              print(f"发现 Workflow：{filename}")
              print(f"  源码：{repo_url}")
              print(f"  分支：{branch}")
              print(f"  Key：{source_key}")
              print(
                  f"  workflow_dispatch："
                  f"{'是' if dispatch_match else '否'}"
              )

          # --------------------------------------------------------
          # 去重后的源码列表
          # --------------------------------------------------------

          sources = {}

          for item in workflows:

              key = item["source_key"]

              if key not in sources:
                  sources[key] = {
                      "repo": item["repo"],
                      "branch": item["branch"]
                  }

          # --------------------------------------------------------
          # 保存扫描结果
          # --------------------------------------------------------

          os.makedirs(".github/source-state", exist_ok=True)

          with open(
              ".github/source-state/workflows.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  workflows,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              ".github/source-state/sources.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sources,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print(f"发现 Workflow：{len(workflows)}")
          print(f"发现独立源码：{len(sources)}")
          print("============================================================")
          PY

      # ==========================================================
      # 自动检测所有源码
      # ==========================================================

      - name: 检测所有源码更新
        id: check
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "开始检测源码"
          echo "============================================================"

          python3 <<'PY'
          import os
          import json
          import subprocess

          SOURCES_FILE = ".github/source-state/sources.json"
          STATE_DIR = ".github/source-state"

          with open(SOURCES_FILE, "r", encoding="utf-8") as f:
              sources = json.load(f)

          updated = []

          # --------------------------------------------------------
          # 默认状态
          # --------------------------------------------------------

          github_output = os.environ.get("GITHUB_OUTPUT")

          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write("has_updates=false\n")

          # --------------------------------------------------------
          # 检测每一个独立源码
          # --------------------------------------------------------

          for source_key, source in sources.items():

              repo = source["repo"]
              branch = source["branch"]

              safe_name = (
                  source_key
                  .replace("/", "__")
                  .replace("@", "__")
                  .replace(":", "__")
              )

              state_file = os.path.join(
                  STATE_DIR,
                  safe_name
              )

              print("")
              print("------------------------------------------------------------")
              print(f"源码：{source_key}")
              print(f"仓库：{repo}")
              print(f"分支：{branch}")
              print("------------------------------------------------------------")

              url = f"https://github.com/{repo}.git"

              result = subprocess.run(
                  [
                      "git",
                      "ls-remote",
                      url,
                      f"refs/heads/{branch}"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("❌ git ls-remote 失败")
                  print(result.stderr)
                  continue

              new_commit = ""

              for line in result.stdout.splitlines():

                  parts = line.split()

                  if len(parts) >= 1:
                      new_commit = parts[0]
                      break

              if not new_commit:
                  print("❌ 无法获取最新 Commit")
                  continue

              old_commit = ""

              if os.path.isfile(state_file):

                  with open(
                      state_file,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      old_commit = f.read().strip()

              print(
                  f"旧 Commit："
                  f"{old_commit if old_commit else '无'}"
              )

              print(f"新 Commit：{new_commit}")

              # ----------------------------------------------------
              # 首次检测
              # ----------------------------------------------------

              if not old_commit:

                  print("首次检测")

                  with open(
                      state_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(new_commit)

                  # 首次检测也加入更新列表
                  updated.append(source_key)

                  print("已记录当前 Commit")
                  print("首次检测触发编译")

                  continue

              # ----------------------------------------------------
              # 源码发生变化
              # ----------------------------------------------------

              if old_commit != new_commit:

                  print("✅ 检测到源码更新")

                  with open(
                      state_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(new_commit)

                  updated.append(source_key)

                  print("已更新状态")

              else:

                  print("源码没有更新")

          # --------------------------------------------------------
          # 保存更新列表
          # --------------------------------------------------------

          with open(
              ".github/source-state/updated.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  updated,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("============================================================")
          print("源码检测完成")
          print(f"发生更新的源码：{len(updated)}")
          print("============================================================")

          for item in updated:
              print(f"  UPDATED: {item}")

          if github_output and updated:
              with open(
                  github_output,
                  "a",
                  encoding="utf-8"
              ) as out:
                  out.write("has_updates=true\n")
          PY

      # ==========================================================
      # 保存源码状态
      # ==========================================================

      - name: 保存源码状态
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/source-state; then
            echo "源码状态没有变化"
            exit 0
          fi

          echo "检测到源码状态变化"

          git add .github/source-state

          git commit -m "chore: update source state"

          git push origin HEAD:main

      # ==========================================================
      # 自动匹配并触发 Workflow
      # ==========================================================

      - name: 自动匹配并触发编译
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@main
        with:
          script: |
            const fs = require("fs");

            const workflowsFile =
              ".github/source-state/workflows.json";

            const updatedFile =
              ".github/source-state/updated.json";

            if (!fs.existsSync(workflowsFile)) {
              console.log("❌ workflows.json 不存在");
              return;
            }

            if (!fs.existsSync(updatedFile)) {
              console.log("❌ updated.json 不存在");
              return;
            }

            const workflows =
              JSON.parse(
                fs.readFileSync(
                  workflowsFile,
                  "utf8"
                )
              );

            const updated =
              JSON.parse(
                fs.readFileSync(
                  updatedFile,
                  "utf8"
                )
              );

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("源码更新列表");
            console.log(
              "============================================================"
            );

            for (const source of updated) {
              console.log(`UPDATED: ${source}`);
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("开始自动匹配 Workflow");
            console.log(
              "============================================================"
            );

            const matched = [];

            for (const workflow of workflows) {

              // 没有 workflow_dispatch 无法自动触发
              if (!workflow.dispatch) {

                console.log(
                  `跳过：${workflow.file}`
                );

                console.log(
                  "  原因：没有 workflow_dispatch"
                );

                continue;
              }

              if (
                !updated.includes(
                  workflow.source_key
                )
              ) {
                continue;
              }

              matched.push(workflow);

              console.log(
                `✅ 匹配：${workflow.file}`
              );

              console.log(
                `   源码：${workflow.source_key}`
              );
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log(
              `最终匹配 Workflow：${matched.length}`
            );
            console.log(
              "============================================================"
            );

            if (matched.length === 0) {

              console.log(
                "没有需要触发的 Workflow"
              );

              return;
            }

            // ======================================================
            // 自动触发
            // ======================================================

            for (const workflow of matched) {

              console.log("");
              console.log(
                `🚀 正在触发：${workflow.file}`
              );

              try {

                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.file,
                  ref: "main"
                });

                console.log(
                  `✅ 触发成功：${workflow.file}`
                );

              } catch (error) {

                console.log(
                  `❌ 触发失败：${workflow.file}`
                );

                console.log(
                  error.message
                );

                throw error;
              }
            }

            console.log("");
            console.log(
              "============================================================"
            );
            console.log("所有匹配 Workflow 已处理");
            console.log(
              "============================================================"
            );
