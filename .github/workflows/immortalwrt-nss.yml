name: ImmortalWrt-NSS

on:
  workflow_dispatch:
  schedule:
    - cron: "16 16 * * *"

permissions:
  contents: write

env:
  DIY_P1_SH: nss/diy-part1.sh
  DIY_P2_SH: nss/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: IPQ807x
            repo_url: https://github.com/LiBwrt/LibWrt
            repo_branch: 25.12-nss
            config: nss/immortalwrt/ipq807x.config
            config_final: nss/immortalwrt/ipq807x.config.final

          # - name: H68K
          #   repo_url: https://github.com/LiBwrt/LibWrt
          #   repo_branch: 25.12-nss
          #   config: nss/immortalwrt/h68k.config
          #   config_final: nss/immortalwrt/h68k.config.final

          # - name: X86
          #   repo_url: https://github.com/immortalwrt/immortalwrt
          #   repo_branch: master
          #   config: nss/immortalwrt/x86.config
          #   config_final: nss/immortalwrt/x86.config.final

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl ccache

      - name: 设置时间
        run: |
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "DATETIME=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: 克隆源码
        run: |
          git clone --depth=1 \
            -b "${{ matrix.repo_branch }}" \
            "${{ matrix.repo_url }}" openwrt

      - name: DIY 第一阶段
        run: |
          [ ! -f "$DIY_P1_SH" ] || bash "$DIY_P1_SH"

      - name: 更新 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入配置
        run: |
          test -f "${{ matrix.config }}"
          cp -f "${{ matrix.config }}" openwrt/.config

      - name: DIY 第二阶段
        run: |
          [ ! -f "$DIY_P2_SH" ] || bash "$DIY_P2_SH"

      - name: 生成最终配置
        working-directory: openwrt
        run: |
          make defconfig

      - name: 保存最终配置
        run: |
          mkdir -p "final-config/${{ matrix.name }}"
          cp openwrt/.config \
            "final-config/${{ matrix.name }}/.config"
          echo "${{ matrix.config_final }}" \
            > "final-config/${{ matrix.name }}/TARGET"

      - name: 开始编译
        working-directory: openwrt
        run: |
          make -j$(nproc) download
          make -j$(nproc) V=s

      - name: 获取设备名称
        run: |
          d=$(grep -E '^CONFIG_TARGET_.*_DEVICE_' openwrt/.config \
            | head -n1 \
            | sed -E 's/CONFIG_TARGET_([^=]+)=y/' || true)
          echo "DEVICE_NAME=${d:-${{ matrix.name }}}" >> "$GITHUB_ENV"

      - name: 上传完整编译目录
        uses: actions/upload-artifact@v7
        with:
          name: 编译文件-${{ matrix.name }}-${{ env.DATE }}
          path: openwrt/bin/
          retention-days: 7
          compression-level: 1

      - name: 整理固件
        run: |
          mkdir -p firmware
          cp -a openwrt/bin/targets/. firmware/
          cp openwrt/.config firmware/.config

      - name: 上传固件
        uses: actions/upload-artifact@v7
        with:
          name: 固件-${{ matrix.name }}-${{ env.DATE }}
          path: firmware/
          retention-days: 7
          compression-level: 1

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.name }}-${{ env.DATE }}
          name: "${{ matrix.name }} 固件 ${{ env.DATE }}"
          body: |
            ## 编译信息

            项目：${{ matrix.name }}
            源码：${{ matrix.repo_url }}
            分支：${{ matrix.repo_branch }}
            设备：${{ env.DEVICE_NAME }}
            配置：${{ matrix.config }}
            最终配置：${{ matrix.config_final }}
            编译时间：${{ env.DATETIME }}

          files: firmware/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传最终配置
        uses: actions/upload-artifact@v7
        with:
          name: 最终配置-${{ matrix.name }}
          path: final-config/${{ matrix.name }}/
          retention-days: 7

  save-config:
    name: 保存最终配置
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载最终配置
        uses: actions/download-artifact@v5
        with:
          pattern: 最终配置-*
          path: final-configs
          merge-multiple: false

      - name: 写入最终配置
        run: |
          for d in final-configs/最终配置-*; do
            [ -f "$d/.config" ] || continue
            [ -f "$d/TARGET" ] || continue
            t=$(cat "$d/TARGET")
            mkdir -p "$(dirname "$t")"
            cp "$d/.config" "$t"
          done

      - name: 提交最终配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nss/immortalwrt/*.config.final
          git diff --cached --quiet && exit 0
          git commit -m "更新最终配置 ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:main

  cleanup:
    name: 清理旧工作流
    needs: [build, save-config]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 清理
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
