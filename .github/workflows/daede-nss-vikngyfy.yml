name: Openwrt_daede-nss-vikngyfy

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      BUILD_CONFIG_ONLY:
        description: '仅输出完整配置，不编译固件'
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "16 16 * * *"

env:
  OPENWRT_NAME: Openwrt
  REPO: googlewmb/qca-all-in-one
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: main
  CONFIG_FILE: nss/immortalwrt/.config
  DIY_P1_SH: nss/diy-part1.sh
  DIY_P2_SH: nss/diy-part2.sh
  UPLOAD_BIN: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    strategy:
      matrix:
        config:
          - ipq60x.txt
          - ipq80x.txt
      fail-fast: false

    env:
      CONFIG_BUILD: nss/immortalwrt/${{ matrix.config }}
      BUILD_CONFIG_ONLY: ${{ github.event.inputs.BUILD_CONFIG_ONLY || 'false' }}

    runs-on: ubuntu-latest

    steps:
    - name: 释放Ubuntu磁盘空间
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 加载项目文件
      uses: actions/checkout@main

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get full-upgrade -y
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
        libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
        ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
        python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

    - name: 设置当前的日期
      run: |
        sudo timedatectl set-timezone "$TZ"
        echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "date3=$(date '+%Y年%m月%d日')" >> $GITHUB_ENV

    - name: 下载固件源码
      run: |
        git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt

    - name: 执行DIY_P1_SH
      run: |
        chmod +x "${GITHUB_WORKSPACE}/${{ env.DIY_P1_SH }}"
        cd openwrt
        "${GITHUB_WORKSPACE}/${{ env.DIY_P1_SH }}"

    - name: 更新feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载config 执行DIY_P2_SH defconfig
      run: |
        [ -e "${GITHUB_WORKSPACE}/${{ env.CONFIG_BUILD }}" ] && mv "${GITHUB_WORKSPACE}/${{ env.CONFIG_BUILD }}" openwrt/.config
        chmod +x "${GITHUB_WORKSPACE}/${{ env.DIY_P2_SH }}"
        cd openwrt
        "${GITHUB_WORKSPACE}/${{ env.DIY_P2_SH }}"
        make defconfig

    - name: 仅输出完整配置
      if: env.BUILD_CONFIG_ONLY == 'true'
      working-directory: ./openwrt
      run: |
        echo "========================================"
        echo "仅输出完整配置模式"
        echo "========================================"
        echo "当前配置: ${{ matrix.config }}"
        echo

        echo "========== 完整 .config =========="
        cat .config
        echo "========== 完整 .config 结束 =========="

        mkdir -p config-output

        cp .config \
          "config-output/${{ matrix.config }}_${{ env.date1 }}_full.config"

        echo
        echo "========================================"
        echo "配置文件已生成"
        echo "========================================"

        ls -lh config-output/

    - name: 上传完整配置
      if: env.BUILD_CONFIG_ONLY == 'true'
      uses: actions/upload-artifact@main
      with:
        name: config_${{ env.OPENWRT_NAME }}_${{ matrix.config }}_${{ env.date1 }}
        path: openwrt/config-output/*.config

    - name: 下载安装包
      if: env.BUILD_CONFIG_ONLY != 'true'
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      if: env.BUILD_CONFIG_ONLY != 'true'
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 获取固件设备名字
      if: env.BUILD_CONFIG_ONLY != 'true'
      working-directory: ./openwrt
      run: |
        grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/^CONFIG_TARGET_(.*)_DEVICE_(.*)=y/\1_\2/' | head -n1 > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV

    - name: 上传bin目录文件
      if: steps.compile.outcome == 'success' && env.UPLOAD_BIN == 'true'
      uses: actions/upload-artifact@main
      with:
        name: bin_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_${{ env.date1 }}
        path: openwrt/bin

    - name: 整理文件到firmware目录
      id: organize
      if: steps.compile.outcome == 'success'
      run: |
        mkdir firmware
        cp -v ./openwrt/.config ./firmware/${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}.config

        find openwrt/bin/targets/*/*/ -maxdepth 1 -type f \
        \( -name "config.buildinfo" -o \
           -name "*.bin" -o \
           -name "*.img" -o \
           -name "*.itb" -o \
           -name "*.ubi" -o \
           -name "*.trx" -o \
           -name "*.tar" \
        \) \
        -exec cp -v {} ./firmware/ \;

        cd firmware

        if [ -f config.buildinfo ]; then
          mv config.buildinfo \
          "${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_config.buildinfo"
        fi

        for file in *.bin *.img *.itb *.ubi *.trx *.tar; do
          [ -f "$file" ] || continue
          mv "$file" \
          "${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_$file"
        done

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传firmware目录文件
      if: steps.organize.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@main
      with:
        name: firmware_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_${{ env.date1 }}
        path: ${{ env.FIRMWARE }}

    - name: 生成release描述
      id: release
      if: steps.organize.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        touch release.txt
        echo "由衷感谢所有为openwrt无私奉献的大佬们" >> release.txt
        echo "当前配置: ${{ matrix.config }}" >> release.txt
        echo "📥 固件下载" >> release.txt

    - name: 发布至release
      if: steps.release.outcome == 'success'
      uses: softprops/action-gh-release@master
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.date3 }}-${{ matrix.config }}
        tag_name: ${{ env.date2 }}-${{ matrix.config }}
        body_path: release.txt

    - name: config文件上传自动更新1
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: config文件上传自动更新2
      run: |
        cd $GITHUB_WORKSPACE
        git clone -b main https://github.com/${{ env.REPO }}.git main

    - name: config文件上传自动更新3
      run: |
        # 额外生成完整配置，绝不覆盖原始 .txt 种子文件
        cp ./openwrt/.config \
          "${GITHUB_WORKSPACE}/main/nss/immortalwrt/${{ matrix.config }}.full.config"

        cd $GITHUB_WORKSPACE/main
        git add "nss/immortalwrt/${{ matrix.config }}.full.config"

        if git diff --cached --quiet; then
          echo "nothing to commit"
        else
          git commit -m "add full config for ${{ matrix.config }} $(date '+%Y-%m-%d %H:%M:%S')"

          # 并发推送重试（最多5次）
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.REPO }}.git" HEAD:main; then
              echo "push success"
              break
            fi
            echo "push failed, retry $i ..."
            sleep 10
          done
        fi

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 删除工作流
      uses: Mattraks/delete-workflow-runs@main
      with:
        delete_workflow_pattern: ${{ github.workflow }}
        retain_days: 7
        keep_minimum_runs: 0
